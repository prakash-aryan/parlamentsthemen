[project]
name = "parltopics"
version = "0.1.0"
description = "Topic classification for Swiss parliamentary affairs with Apertus"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]
db = [
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parltopics"]
