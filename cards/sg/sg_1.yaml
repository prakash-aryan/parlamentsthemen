id: sg_1
version: 1
source_description: The subject area "Arbeit und Gewerbe" of the systematic law collection of the canton
  of St. Gallen, which the canton uses to classify the affairs of its cantonal parliament. Cover what
  cantonal affairs in this subject area are typically about.
name: Labor and Trades
definition: This topic covers cantonal parliamentary affairs related to employment, labor market conditions,
  vocational training, and the regulation of trades and industries within the canton of St. Gallen.
include:
- employment policies
- labor market regulation
- vocational education and training
- trade and industry regulation
- working conditions
- apprenticeship programs
- labor disputes
- economic development in trades
exclude:
- federal tax policy
- national social security
- international trade agreements
- criminal law
- cantonal budget allocation
- municipal zoning laws
