id: aps_6_3_4
version: 1
source_description: The topic "Bodenrecht" ("Droit foncier") in the chapter "Raumplanung und Wohnungswesen"
  of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Land Law
definition: Parliamentary affairs concerning the legal framework governing the acquisition, use, ownership,
  and transfer of land, including regulations on zoning, expropriation, and property rights within the
  context of spatial planning and housing policy.
include:
- land ownership regulations
- zoning and land-use planning
- expropriation procedures
- property rights and easements
- land development permits
- agricultural land protection
- urban land allocation
- compensation for land use restrictions
exclude:
- building codes and construction standards
- housing subsidies and social housing
- transport infrastructure planning
- environmental impact assessments
- energy policy and renewable energy on land
- cultural heritage preservation of buildings
