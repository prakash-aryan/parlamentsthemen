id: aps_4_2
version: 1
source_description: 'The chapter "Bildung und Forschung" ("Enseignement et recherche") of the domain "Gesellschaft
  und Kultur" in the Année Politique Suisse classification of Swiss politics. It contains these topics:
  Grundschulen; Berufsbildung; Mittelschulen; Hochschulen; Forschung. Cover what parliamentary affairs
  in this chapter are typically about.'
name: Education and Research
definition: This topic covers parliamentary discussions and decisions related to Switzerland's education
  system and research activities, including school types, vocational training, higher education institutions,
  and scientific research funding and policy.
