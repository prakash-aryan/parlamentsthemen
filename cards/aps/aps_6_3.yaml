id: aps_6_3
version: 1
source_description: 'The chapter "Raumplanung und Wohnungswesen" ("Aménagement du territoire et logement")
  of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  It contains these topics: Raumplanung; Wohnungsbau und -eigentum; Mietwesen; Bodenrecht. Cover what
  parliamentary affairs in this chapter are typically about.'
name: Spatial Planning and Housing
definition: This topic covers parliamentary debates and initiatives related to Switzerland's land use
  policies, housing construction, property ownership, rental regulations, and land rights. It addresses
  how Switzerland manages its territory, ensures adequate housing supply, regulates rental markets, and
  governs land ownership and development rights.
