id: aps_7_1_7
version: 1
source_description: The topic "Datenschutz" ("Protection des données") in the chapter "Rechtsordnung"
  of the domain "Rechts- und Sicherheitspolitik" in the Année Politique Suisse classification of Swiss
  politics. Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Data Protection
definition: Parliamentary affairs concerning the protection of personal data and privacy rights, including
  legislation, oversight of data processing practices, and safeguarding individual freedoms in the digital
  age.
include:
- personal data protection laws
- privacy rights
- data processing regulations
- digital surveillance oversight
- information security
- individual data rights
- compliance with data protection standards
exclude:
- criminal law enforcement
- intelligence services operations
- cybersecurity infrastructure
- international data transfers
- data protection in private sector
- digital identity systems
