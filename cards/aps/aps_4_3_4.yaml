id: aps_4_3_4
version: 1
source_description: The topic "Heimatschutz und Denkmalpflege" ("Protection des sites et du patrimoine")
  in the chapter "Kultur, Sprache, Kirchen" of the domain "Gesellschaft und Kultur" in the Année Politique
  Suisse classification of Swiss politics. Cover what parliamentary affairs on this topic are typically
  about, and what belongs to neighbouring topics of the same chapter instead.
name: Cultural Heritage Protection
definition: Parliamentary affairs concerning the preservation of historical buildings, monuments, and
  cultural landscapes, including policies on heritage conservation, restoration funding, and protection
  against inappropriate development or demolition.
include:
- heritage conservation
- monument preservation
- historical building protection
- cultural landscape safeguarding
- restoration funding
- heritage policy
- architectural heritage
- cultural site designation
exclude:
- language policy
- religious affairs
- contemporary art funding
- museum operations
- literary promotion
- film industry support
