id: aps_4_4_1
version: 1
source_description: The topic "Medienpolitische Grundfragen" ("Aspects généraux de la politique médiatique")
  in the chapter "Medien" of the domain "Gesellschaft und Kultur" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Media Policy Foundations
definition: Parliamentary debates and motions concerning the fundamental principles, goals, and framework
  of media policy in Switzerland, including issues of media freedom, diversity, public service broadcasting,
  and the role of the state in the media landscape.
include:
- media freedom
- public service broadcasting
- media diversity
- state regulation of media
- digital media policy
- media pluralism
- press freedom
- media funding models
exclude:
- specific media law amendments
- individual media outlet regulation
- copyright and intellectual property
- cultural policy funding
- film and audiovisual support
- media literacy education programs
