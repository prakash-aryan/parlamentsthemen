id: aps_8_3_4
version: 1
source_description: The topic "Banken" ("Banques") in the chapter "Geld, Währung und Kredit" of the domain
  "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Banking Sector Regulation
definition: Parliamentary affairs concerning the regulation, supervision, and oversight of banks and financial
  institutions within Switzerland, including issues related to stability, consumer protection, and systemic
  risk management.
include:
- banking supervision
- financial stability
- consumer protection in banking
- banking licenses and authorizations
- anti-money laundering measures
- bank bailout mechanisms
- cross-border banking regulation
exclude:
- monetary policy
- exchange rate management
- taxation of financial transactions
- private investment funds
- insurance sector regulation
- real estate financing
