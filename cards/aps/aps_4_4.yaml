id: aps_4_4
version: 1
source_description: 'The chapter "Medien" ("Médias") of the domain "Gesellschaft und Kultur" in the Année
  Politique Suisse classification of Swiss politics. It contains these topics: Medienpolitische Grundfragen;
  Presse; Radio und Fernsehen; Digitale Medien; Meinungsforschung. Cover what parliamentary affairs in
  this chapter are typically about.'
name: Media Policy and Landscape
definition: This topic covers parliamentary discussions and decisions related to the media sector in Switzerland,
  including foundational media policy questions, the role and regulation of the press, broadcasting (radio
  and television), digital media platforms, and research on public opinion.
include:
- media regulation
- press freedom
- broadcasting standards
- digital media governance
- public opinion research
- media diversity
- journalism ethics
- media funding models
exclude:
- cultural heritage preservation
- language policy
- education system reforms
- healthcare policy
- transport infrastructure
- economic development
- environmental protection
