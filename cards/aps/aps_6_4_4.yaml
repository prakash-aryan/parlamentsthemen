id: aps_6_4_4
version: 1
source_description: The topic "Gewässerschutz" ("Protection des eaux") in the chapter "Umweltschutz" of
  the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Water Protection
definition: Parliamentary affairs under this topic focus on safeguarding water resources from pollution,
  ensuring the quality of drinking water, and preserving aquatic ecosystems through legislation, regulation,
  and oversight of water management practices.
include:
- drinking water quality
- wastewater treatment
- river and lake protection
- groundwater conservation
- pollution prevention
- water resource management
- aquatic habitat preservation
- chemical and industrial discharges
exclude:
- air quality regulation
- waste disposal policies
- climate change mitigation measures
- energy production and distribution
- transport infrastructure planning
- agricultural land use policies
- urban development zoning
