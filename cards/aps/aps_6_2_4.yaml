id: aps_6_2_4
version: 1
source_description: The topic "Wasserkraft" ("Force hydraulique") in the chapter "Energie" of the domain
  "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Hydropower
definition: Parliamentary affairs on hydropower focus on the generation, regulation, and environmental
  impact of electricity produced from water resources, including dam construction, river management, and
  energy policy implications.
include:
- Hydroelectric power plants
- River and reservoir management
- Renewable energy policy
- Environmental impact assessments
- Energy supply security
- Water rights and usage
- Small-scale hydropower projects
exclude:
- Nuclear energy
- Fossil fuel power generation
- Wind and solar energy
- Grid infrastructure development
- Energy efficiency measures
- Carbon pricing and emissions trading
