id: aps_8_1_7
version: 1
source_description: The topic "Wirtschaftsordnung" ("Ordre économique") in the chapter "Wirtschaftspolitik"
  of the domain "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Economic System
definition: Parliamentary affairs under this topic examine the fundamental principles, structures, and
  regulations governing economic activity within Switzerland, including market mechanisms, competition
  policy, and the role of the state in the economy.
include:
- market regulation
- competition policy
- state economic role
- economic freedom
- privatization
- economic governance
- monetary policy framework
- economic liberalization
exclude:
- taxation policy
- budget allocation
- social security
- employment policy
- trade agreements
- financial market supervision
- regional economic development
