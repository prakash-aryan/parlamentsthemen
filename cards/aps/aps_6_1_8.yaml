id: aps_6_1_8
version: 1
source_description: The topic "Telekommunikation" ("Télécommunication") in the chapter "Verkehr und Kommunikation"
  of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Telecommunications
definition: Parliamentary affairs concerning the regulation, development, and infrastructure of telecommunications
  networks, services, and policies in Switzerland, including broadband expansion, spectrum allocation,
  and digital infrastructure.
include:
- Broadband expansion
- 5G network rollout
- Spectrum allocation
- Digital infrastructure
- Telecom regulation
- Universal service obligations
- Cybersecurity in telecom
- Data privacy in telecom services
exclude:
- Postal services
- Railway infrastructure
- Road transport networks
- Air traffic regulation
- Energy grid infrastructure
- Environmental impact of transport
