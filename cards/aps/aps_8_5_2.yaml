id: aps_8_5_2
version: 1
source_description: The topic "Arbeitsmarkt" ("Marché du travail") in the chapter "Arbeit" of the domain
  "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Labor Market
definition: Parliamentary affairs concerning the regulation, development, and conditions of the labor
  market in Switzerland, including employment policies, labor relations, vocational training, and social
  security aspects related to work.
include:
- employment policies
- labor market regulation
- vocational training
- labor relations
- unemployment measures
- working conditions
- social security for workers
exclude:
- monetary policy
- taxation
- economic growth
- industrial subsidies
- trade agreements
- financial market regulation
