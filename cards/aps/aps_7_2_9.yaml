id: aps_7_2_9
version: 1
source_description: The topic "Cybersicherheit" ("Cybersécurité") in the chapter "Sicherheitspolitik"
  of the domain "Rechts- und Sicherheitspolitik" in the Année Politique Suisse classification of Swiss
  politics. Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Cybersecurity
definition: Parliamentary affairs on cybersecurity address the protection of digital infrastructure, data
  privacy, and resilience against cyber threats within Switzerland's security policy framework. They cover
  legislation, oversight of government agencies, and measures to safeguard critical systems and information
  from cyberattacks and espionage. The focus is on national and cross-border digital security strategies,
  incident response, and international cooperation.
include:
- digital infrastructure protection
- data privacy and encryption
- cyber threat detection and response
- critical infrastructure security
- international cyber cooperation
- legislation on cybercrime
- oversight of federal cyber agencies
- cyber defense strategies
exclude:
- physical border security
- conventional military defense
- domestic law enforcement operations
- intellectual property rights enforcement
- internet censorship and content regulation
- telecommunications market regulation
