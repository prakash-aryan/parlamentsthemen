id: aps_3_1_3
version: 1
source_description: The topic "Beziehungen zu internationalen Organisationen" ("Relations avec des organisations
  internationales") in the chapter "Europa- und Aussenpolitik" of the domain "Europa- und Aussenpolitik"
  in the Année Politique Suisse classification of Swiss politics. Cover what parliamentary affairs on
  this topic are typically about, and what belongs to neighbouring topics of the same chapter instead.
name: Swiss Relations with International Organizations
definition: Parliamentary affairs concerning Switzerland's engagement, cooperation, and diplomatic relations
  with international organizations such as the United Nations, World Trade Organization, and other multilateral
  bodies. Includes debates on membership, participation, funding, and alignment with international norms
  and policies.
include:
- UN membership and participation
- WTO trade agreements and compliance
- Multilateral treaty ratification
- Swiss representation in international bodies
- Funding contributions to international organizations
- Adherence to international human rights conventions
- Swiss neutrality in global governance
- International development cooperation programs
exclude:
- Bilateral diplomatic relations with individual countries
- Domestic implementation of international agreements
- National security and defense policy
- EU accession negotiations
- Regional cooperation within Europe (e.g., Schengen, EFTA)
