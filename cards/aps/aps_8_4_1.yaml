id: aps_8_4_1
version: 1
source_description: The topic "Agrarpolitik" ("Politique agricole") in the chapter "Landwirtschaft" of
  the domain "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Agricultural Policy
definition: Parliamentary affairs concerning the regulation, support, and development of agriculture in
  Switzerland, including subsidies, rural development, food security, and environmental sustainability
  in farming practices.
include:
- subsidies for farmers
- rural development programs
- food security measures
- environmental sustainability in agriculture
- animal welfare regulations
- organic farming promotion
- agricultural research funding
- export and import policies for agricultural products
exclude:
- financial market regulation
- industrial policy
- trade agreements (general)
- urban planning
- energy policy
- transport infrastructure
- tourism development
