id: aps_1_1_2
version: 1
source_description: The topic "Verfassungsfragen" ("Questions constitutionnelles") in the chapter "Politische
  Grundfragen" of the domain "Akteure und Institutionen" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Constitutional Questions
definition: Parliamentary affairs concerning the interpretation, amendment, and application of the Swiss
  Federal Constitution, including fundamental rights, federal structure, and constitutional guarantees.
include:
- Federal Constitution interpretation
- Constitutional amendments
- Federal structure and cantonal autonomy
- Fundamental rights and freedoms
- Constitutional guarantees
- Constitutional court rulings review
- Constitutional compliance of laws
exclude:
- Specific legislative proposals (motions/postulates)
- Government accountability (interpellations)
- General policy inquiries (questions)
- International treaties and agreements
- Administrative procedures
