id: aps_2_2
version: 1
source_description: 'The chapter "Wahlen" ("Elections") of the domain "Direkte Demokratie und Wahlen"
  in the Année Politique Suisse classification of Swiss politics. It contains these topics: National-
  und Ständeratswahlen; Wahlen in kantonale Regierungen; Wahlen in kantonale Parlamente; Kommunale Wahlen.
  Cover what parliamentary affairs in this chapter are typically about.'
name: Swiss Elections
definition: This topic covers parliamentary affairs related to the organization, conduct, and regulation
  of elections at the national, cantonal, and municipal levels in Switzerland, including electoral systems,
  voter rights, and election administration.
include:
- National Council elections
- Council of States elections
- Cantonal government elections
- Cantonal parliament elections
- Municipal council elections
- Electoral law reforms
- Voter eligibility criteria
- Election campaign regulations
exclude:
- Referendums
- Initiatives
- Parliamentary motions
- Interpellations
- Postulates
- Questions to the government
