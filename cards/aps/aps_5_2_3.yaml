id: aps_5_2_3
version: 1
source_description: The topic "Invalidenversicherung (IV)" ("Assurance-invalidité (AI)") in the chapter
  "Sozialversicherungen" of the domain "Gesundheit und Sozialsystem" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Disability Insurance (IV/AI)
definition: Parliamentary affairs concerning the Swiss Invalidenversicherung (IV) or French Assurance-invalidité
  (AI), including funding, benefit levels, eligibility criteria, and implementation of disability-related
  social security policies.
include:
- IV benefit amounts
- eligibility for disability pensions
- rehabilitation programs
- integration of disabled persons into the workforce
- coordination with other social insurances
- administrative procedures and reforms
- financing of disability services
- monitoring of IV effectiveness
exclude:
- healthcare services (e.g., hospitals, medical treatments)
- unemployment insurance
- old-age and survivors' insurance
- family allowances
- social assistance (Sozialhilfe)
- mental health policy (unless directly linked to disability)
