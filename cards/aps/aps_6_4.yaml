id: aps_6_4
version: 1
source_description: 'The chapter "Umweltschutz" ("Protection de l''environnement") of the domain "Infrastruktur
  und Umwelt" in the Année Politique Suisse classification of Swiss politics. It contains these topics:
  Allgemeiner Umweltschutz; Naturschutz; Bodenschutz; Gewässerschutz; Luftreinhaltung; Klimapolitik; Lärmschutz;
  Abfälle und Recycling; Schutz vor Naturgefahren. Cover what parliamentary affairs in this chapter are
  typically about.'
name: Environmental Protection
definition: This topic covers parliamentary discussions and decisions related to safeguarding the natural
  environment, managing natural resources, and mitigating environmental hazards across Switzerland. It
  includes policies on nature conservation, soil protection, water quality, air pollution control, climate
  change mitigation, noise reduction, waste management, and protection against natural disasters.
include:
- General environmental protection
- Nature conservation
- Soil protection
- Water protection
- Air quality control
- Climate policy
- Noise abatement
- Waste management and recycling
- Protection against natural hazards
exclude:
- Economic development policies
- Labor market regulations
- Healthcare system reforms
- Education system changes
- Taxation policies
- Transport infrastructure planning
- Energy production and distribution
