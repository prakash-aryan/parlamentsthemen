id: aps_4_1_4
version: 1
source_description: The topic "Frauen- und Gleichstellungsfragen" ("Femmes et égalité des sexes") in the
  chapter "Soziale Gruppen" of the domain "Gesellschaft und Kultur" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Gender Equality and Women's Issues
definition: Parliamentary affairs focusing on policies, measures, and initiatives aimed at achieving gender
  equality, promoting women's rights, and addressing discrimination based on sex in all areas of society,
  including employment, education, family, and political representation.
include:
- women's rights
- gender equality policies
- pay equity
- representation of women in politics
- prevention of gender-based violence
- family and work-life balance
- gender mainstreaming in legislation
- women's health and reproductive rights
exclude:
- youth policies
- elderly care
- immigration and integration
- cultural heritage preservation
- environmental protection
- economic development strategies
