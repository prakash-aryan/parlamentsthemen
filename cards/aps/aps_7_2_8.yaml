id: aps_7_2_8
version: 1
source_description: The topic "Polizei" ("Police") in the chapter "Sicherheitspolitik" of the domain "Rechts-
  und Sicherheitspolitik" in the Année Politique Suisse classification of Swiss politics. Cover what parliamentary
  affairs on this topic are typically about, and what belongs to neighbouring topics of the same chapter
  instead.
name: Swiss Police Policy
definition: Parliamentary affairs concerning the organization, powers, funding, and oversight of police
  forces at federal, cantonal, and municipal levels in Switzerland, including law enforcement, public
  safety, and police cooperation.
include:
- police organization and structure
- police powers and jurisdiction
- police funding and budget
- police oversight and accountability
- intercantonal police cooperation
- municipal police responsibilities
- police equipment and technology
- data protection in policing
exclude:
- military defense and armed forces
- intelligence and counterterrorism
- criminal justice procedures
- immigration and border control
- fire and rescue services
- private security services
