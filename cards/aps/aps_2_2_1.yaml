id: aps_2_2_1
version: 1
source_description: The topic "National- und Ständeratswahlen" ("Elections du Conseil national et du Conseil
  des Etats") in the chapter "Wahlen" of the domain "Direkte Demokratie und Wahlen" in the Année Politique
  Suisse classification of Swiss politics. Cover what parliamentary affairs on this topic are typically
  about, and what belongs to neighbouring topics of the same chapter instead.
name: Swiss National and Council of States Elections
definition: This topic covers parliamentary affairs related to the organization, conduct, and regulation
  of elections for the National Council and the Council of States, including electoral law, voting procedures,
  campaign financing, and electoral reforms.
include:
- electoral law amendments
- voting procedures
- electoral roll management
- campaign financing rules
- electoral district boundaries
- ballot design and accessibility
- e-voting trials and implementation
- election monitoring and oversight
exclude:
- referendums and initiatives
- municipal or cantonal elections
- parliamentary motions or postulates
- party financing
- civil service neutrality in elections
- voter turnout analysis
