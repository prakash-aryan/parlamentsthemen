id: aps_5_2_7
version: 1
source_description: The topic "Mutterschaftsversicherung" ("Assurance-maternité") in the chapter "Sozialversicherungen"
  of the domain "Gesundheit und Sozialsystem" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Maternity Insurance
definition: Parliamentary affairs on maternity insurance focus on the design, funding, scope, and administration
  of social security benefits for mothers before, during, and after childbirth, including benefit duration,
  payment levels, eligibility criteria, and integration with existing health and social systems.
include:
- maternity benefit duration
- eligibility for new mothers
- financing of maternity benefits
- coordination with health insurance
- parental leave entitlements
- benefit levels and indexation
- administrative procedures
- equal treatment of self-employed mothers
exclude:
- paternity leave policies
- childcare infrastructure funding
- family tax allowances
- long-term care insurance
- unemployment insurance
- disability insurance
