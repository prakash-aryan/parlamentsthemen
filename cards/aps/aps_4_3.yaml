id: aps_4_3
version: 1
source_description: 'The chapter "Kultur, Sprache, Kirchen" ("Culture, langues, églises") of the domain
  "Gesellschaft und Kultur" in the Année Politique Suisse classification of Swiss politics. It contains
  these topics: Kultur; Sprachfragen; Religion und Kirchen; Heimatschutz und Denkmalpflege; Urheberrecht.
  Cover what parliamentary affairs in this chapter are typically about.'
name: Culture, Language, and Religion Affairs
definition: This topic covers parliamentary discussions and decisions related to cultural preservation,
  linguistic diversity, religious matters, heritage protection, and intellectual property rights within
  Switzerland's political landscape.
