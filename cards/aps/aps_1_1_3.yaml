id: aps_1_1_3
version: 1
source_description: The topic "Territorialfragen" ("Questions territoriales") in the chapter "Politische
  Grundfragen" of the domain "Akteure und Institutionen" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Territorial Questions
definition: Parliamentary affairs concerning the organization, boundaries, and governance of Swiss territories,
  including cantonal borders, regional autonomy, and the relationship between federal and cantonal jurisdictions.
include:
- cantonal borders
- regional autonomy
- federal-cantonal jurisdiction
- territorial reorganization
- municipal boundaries
- language regions
- cross-border cooperation
exclude:
- economic policy
- social welfare
- education system
- environmental regulations
- taxation
- transport infrastructure
