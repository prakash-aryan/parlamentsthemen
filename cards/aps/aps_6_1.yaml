id: aps_6_1
version: 1
source_description: 'The chapter "Verkehr und Kommunikation" ("Transports et communications") of the domain
  "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics. It contains
  these topics: Verkehrspolitik; Öffentlicher Verkehr; Strassenverkehr; Eisenbahn; Luftfahrt; Schifffahrt;
  Post; Telekommunikation; Digitalisierung. Cover what parliamentary affairs in this chapter are typically
  about.'
name: Transport and Communication Policy
definition: This topic covers parliamentary discussions and decisions related to the planning, regulation,
  and development of transport systems and communication networks across Switzerland. It includes policies
  governing road, rail, air, and water transport, as well as postal services, telecommunications, and
  digital infrastructure. The focus is on ensuring efficient, sustainable, and accessible mobility and
  communication for the population and economy.
include:
- public transport systems
- road traffic regulation
- railway infrastructure
- air transport policy
- shipping and waterways
- postal services
- telecommunications networks
- digitalization of services
- transport infrastructure funding
exclude:
- energy policy
- agricultural subsidies
- healthcare services
- education systems
- housing policy
- cultural funding
- defense and security
