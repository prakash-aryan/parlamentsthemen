id: aps_7_2
version: 1
source_description: 'The chapter "Sicherheitspolitik" ("Politique de sécurité") of the domain "Rechts-
  und Sicherheitspolitik" in the Année Politique Suisse classification of Swiss politics. It contains
  these topics: Grundfragen zur Armee; Militärorganisation; Rüstung; Militäreinsätze; Bevölkerungsschutz;
  Zivildienst und Dienstverweigerung; Öffentliche Sicherheit; Polizei; Cybersicherheit; Versorgungssicherheit.
  Cover what parliamentary affairs in this chapter are typically about.'
name: Swiss Security Policy
definition: This topic covers parliamentary debates and decisions related to Switzerland's defense, civil
  protection, public safety, and cybersecurity, including military organization, arms control, peacekeeping
  missions, alternative service, and ensuring national resilience against various threats.
include:
- Army organization
- Arms and armaments
- Military deployments
- Civil protection
- Alternative service and conscientious objection
- Public safety
- Police matters
- Cybersecurity
- Supply security
exclude:
- Foreign policy
- Economic policy
- Health policy
- Environmental policy
- Education policy
- Social welfare
- Transport infrastructure
