id: aps_2_1_3
version: 1
source_description: The topic "Volksinitiative" ("Initiative populaire") in the chapter "Direkte Demokratie"
  of the domain "Direkte Demokratie und Wahlen" in the Année Politique Suisse classification of Swiss
  politics. Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Popular Initiative
definition: Parliamentary affairs concerning the processing of popular initiatives submitted by citizens
  to propose amendments to the Swiss Federal Constitution or to trigger a referendum on existing laws.
  This includes discussions on admissibility, counterproposals, and the legislative follow-up to approved
  initiatives.
include:
- submission of citizen-initiated constitutional amendments
- parliamentary debate on initiative admissibility
- formulation of counterproposals
- legislative implementation of approved initiatives
- referendum triggers based on popular initiatives
- popular initiative campaigns
- initiative committee activities
- popular vote organization
exclude:
- ordinary parliamentary motions
- postulates
- interpellations
- simple parliamentary questions
- election procedures
- cantonal or municipal referendums
- binding cantonal initiatives
