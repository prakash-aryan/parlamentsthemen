id: aps_8_2_1
version: 1
source_description: The topic "Budget" ("Budget") in the chapter "Öffentliche Finanzen" of the domain
  "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Budget Affairs
definition: Parliamentary motions, postulates, interpellations, and questions concerning the preparation,
  approval, execution, and auditing of public budgets at federal, cantonal, and city levels. Includes
  debates on revenue sources, expenditure priorities, deficit management, and fiscal policy compliance.
include:
- Budget preparation
- Revenue allocation
- Expenditure priorities
- Deficit and surplus management
- Budget execution monitoring
- Fiscal policy compliance
- Taxation and revenue measures
- Public spending efficiency
exclude:
- Debt management
- Economic stimulus packages
- Monetary policy
- Banking regulation
- Financial market oversight
- Infrastructure financing specifics
- Social welfare program funding details
