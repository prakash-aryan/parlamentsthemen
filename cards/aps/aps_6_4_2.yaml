id: aps_6_4_2
version: 1
source_description: The topic "Naturschutz" ("Protection de la nature") in the chapter "Umweltschutz"
  of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Nature Conservation
definition: Parliamentary affairs concerning the protection of natural habitats, biodiversity, endangered
  species, and ecological integrity within Switzerland's environmental framework. These motions, postulates,
  interpellations, and questions address policies, legislation, and measures to preserve natural landscapes,
  forests, waters, and wildlife from human-induced threats.
include:
- protection of natural habitats
- biodiversity preservation
- endangered species
- ecological integrity
- wildlife conservation
- natural landscape preservation
- forest protection
- water body conservation
exclude:
- energy production
- transport infrastructure
- urban development
- waste management
- climate change mitigation policies
- agricultural practices
