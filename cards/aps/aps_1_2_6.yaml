id: aps_1_2_6
version: 1
source_description: The topic "Judikative" ("Tribunaux") in the chapter "Institutionen" of the domain
  "Akteure und Institutionen" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Judiciary
definition: Parliamentary affairs concerning the organization, functioning, independence, and oversight
  of courts and judicial authorities at federal, cantonal, and municipal levels. Includes debates on judicial
  appointments, court procedures, legal reforms, and the relationship between the judiciary and other
  branches of government.
include:
- court organization
- judicial independence
- appointment of judges
- court procedures
- legal reforms
- oversight of judiciary
- conflict between branches
- access to justice
exclude:
- law enforcement
- police powers
- criminal investigations
- penal code amendments
- prosecution authority
- prison system
- criminal procedure
