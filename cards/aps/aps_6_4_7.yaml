id: aps_6_4_7
version: 1
source_description: The topic "Lärmschutz" ("Mesures contre le bruit") in the chapter "Umweltschutz" of
  the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Noise Protection
definition: Parliamentary affairs concerning measures to reduce, regulate, and mitigate noise pollution
  from transport, industry, construction, and other sources, with a focus on environmental protection
  and public health.
include:
- traffic noise abatement
- industrial noise regulations
- construction noise limits
- urban noise control
- aviation noise mitigation
- railway noise reduction
- noise impact assessments
- soundproofing requirements
exclude:
- air quality monitoring
- waste management
- water pollution control
- climate change mitigation
- energy efficiency standards
- biodiversity conservation
- chemical substance regulation
