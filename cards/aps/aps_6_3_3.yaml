id: aps_6_3_3
version: 1
source_description: The topic "Mietwesen" ("Logement et loyer") in the chapter "Raumplanung und Wohnungswesen"
  of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Housing and Rents
definition: Parliamentary affairs under this topic focus on regulations, policies, and initiatives related
  to rental housing, including rent control, housing affordability, tenant rights, and the supply of residential
  properties. It addresses issues such as the balance between private and social housing, urban development
  impacts on housing availability, and measures to ensure adequate and affordable housing for all income
  groups.
include:
- rent control mechanisms
- tenant protection laws
- social housing development
- housing affordability policies
- rental market regulation
- housing supply strategies
- urban planning and housing integration
exclude:
- building construction permits
- energy efficiency standards for buildings
- real estate investment incentives
- commercial property regulations
- agricultural land use planning
- infrastructure project funding
