id: aps_5_2_8
version: 1
source_description: The topic "Erwerbsersatzordnung (EO)" ("Allocations pour perte de gain (APG)") in
  the chapter "Sozialversicherungen" of the domain "Gesundheit und Sozialsystem" in the Année Politique
  Suisse classification of Swiss politics. Cover what parliamentary affairs on this topic are typically
  about, and what belongs to neighbouring topics of the same chapter instead.
name: Loss of Income Allocation Scheme (EO/APG)
definition: Parliamentary affairs concerning the Swiss system of financial support for individuals unable
  to work due to military or civilian service, illness, accident, maternity, or unemployment. This includes
  debates on benefit levels, eligibility criteria, financing, and reforms to ensure adequate income replacement
  for affected citizens.
include:
- military service compensation
- civilian service benefits
- maternity allowance
- unemployment insurance supplements
- illness and accident benefits
- financing of EO/APG
- eligibility criteria review
- benefit amount adjustments
exclude:
- old-age and survivors' pensions
- disability insurance
- healthcare costs
- social assistance (Sozialhilfe)
- family allowances
- unemployment insurance core benefits
