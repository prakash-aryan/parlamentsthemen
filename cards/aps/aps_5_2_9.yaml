id: aps_5_2_9
version: 1
source_description: The topic "Berufliche Vorsorge" ("Prévoyance professionnelle") in the chapter "Sozialversicherungen"
  of the domain "Gesundheit und Sozialsystem" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Professional Pensions
definition: Parliamentary affairs concerning the regulation, funding, and administration of occupational
  pension schemes in Switzerland, including retirement benefits, investment policies, and coordination
  with other social insurance systems.
include:
- occupational pension funds
- second pillar of the Swiss pension system
- pension fund governance
- investment rules for pension assets
- coordination with AHV/IV
- pension fund solvency
- retirement age and benefits
- employee and employer contributions
exclude:
- health insurance (LAMal/LCA)
- unemployment insurance
- social assistance
- family benefits
- disability insurance
- old-age and survivors' insurance (AHV)
