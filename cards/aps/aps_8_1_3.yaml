id: aps_8_1_3
version: 1
source_description: The topic "Gesellschaftsrecht" ("Droit des sociétés") in the chapter "Wirtschaftspolitik"
  of the domain "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Corporate Law
definition: Parliamentary affairs concerning the legal framework governing the formation, operation, governance,
  and dissolution of companies and other business entities in Switzerland. This includes regulations on
  company types, shareholder rights, corporate governance standards, and compliance requirements.
include:
- company formation and registration
- shareholder rights and duties
- corporate governance rules
- limited liability companies
- joint-stock companies
- business entity dissolution
- compliance and reporting obligations
- cross-border corporate structures
exclude:
- banking and financial regulation
- taxation of corporations
- labor law and employment
- intellectual property rights
- antitrust and competition policy
- insurance sector regulation
