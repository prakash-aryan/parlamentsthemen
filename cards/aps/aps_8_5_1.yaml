id: aps_8_5_1
version: 1
source_description: The topic "Arbeitsrecht" ("Droit du travail") in the chapter "Arbeit" of the domain
  "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Labor Law
definition: Parliamentary affairs concerning the legal framework governing employment relationships, including
  worker protection, working conditions, labor market regulations, and social security provisions within
  the economic and financial policy domain.
include:
- employment contracts
- working hours
- minimum wage
- worker protection
- occupational safety
- equal pay
- labor market regulations
- social security in employment
exclude:
- industrial policy
- economic development
- taxation
- financial market regulation
- trade agreements
- entrepreneurship support
