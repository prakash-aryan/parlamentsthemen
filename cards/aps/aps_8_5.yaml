id: aps_8_5
version: 1
source_description: 'The chapter "Arbeit" ("Travail") of the domain "Wirtschaft und Finanzen" in the Année
  Politique Suisse classification of Swiss politics. It contains these topics: Arbeitsrecht; Arbeitsmarkt;
  Löhne; Sozialpartnerschaft; Arbeitszeit; Arbeitnehmendenschutz. Cover what parliamentary affairs in
  this chapter are typically about.'
name: Labor and Employment
definition: This topic covers parliamentary discussions and legislative matters related to the regulation
  of work, labor market dynamics, wage policies, social partnership between employers and employees, working
  time regulations, and protection of workers' rights in Switzerland.
