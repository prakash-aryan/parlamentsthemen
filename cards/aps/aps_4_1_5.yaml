id: aps_4_1_5
version: 1
source_description: The topic "Familien" ("Familles") in the chapter "Soziale Gruppen" of the domain "Gesellschaft
  und Kultur" in the Année Politique Suisse classification of Swiss politics. Cover what parliamentary
  affairs on this topic are typically about, and what belongs to neighbouring topics of the same chapter
  instead.
name: Family Affairs
definition: Parliamentary matters concerning family structures, policies, support systems, and the well-being
  of families in Switzerland, including childcare, parental leave, family benefits, and domestic relations.
include:
- childcare and early education
- parental leave and work-life balance
- family benefits and allowances
- domestic violence prevention
- family reunification
- support for single-parent families
- elderly care within families
- family-friendly housing policies
exclude:
- youth and education policy
- women's rights and gender equality
- immigration and asylum
- social welfare and poverty
- healthcare and medical services
- labor market and employment
