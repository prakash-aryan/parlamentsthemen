id: aps_5_1
version: 1
source_description: 'The chapter "Gesundheit, Sozialhilfe, Sport" ("Santé, assistance sociale, sport")
  of the domain "Gesundheit und Sozialsystem" in the Année Politique Suisse classification of Swiss politics.
  It contains these topics: Gesundheitspolitik; Ärzte und Pflegepersonal; Spitäler; Medikamente; Suchtmittel;
  Medizinische Forschung; Fortpflanzungsmedizin; Epidemien und Pandemien; Sozialhilfe; Sport. Cover what
  parliamentary affairs in this chapter are typically about.'
name: Health, Social Welfare, and Sport
definition: This topic covers parliamentary discussions and decisions related to public health policies,
  healthcare services, medical research, reproductive medicine, epidemic and pandemic management, social
  welfare programs, and sports development in Switzerland.
