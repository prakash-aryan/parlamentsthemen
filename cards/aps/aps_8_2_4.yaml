id: aps_8_2_4
version: 1
source_description: The topic "Steuern" ("Impôts") in the chapter "Öffentliche Finanzen" of the domain
  "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Taxation
definition: Parliamentary affairs concerning the design, implementation, and reform of tax systems at
  federal, cantonal, and municipal levels, including tax rates, exemptions, and fiscal equity.
include:
- income tax
- corporate tax
- value-added tax (VAT)
- property tax
- tax incentives
- tax evasion prevention
- tax harmonization
- tax administration
exclude:
- public spending
- budget allocation
- debt management
- subsidies
- social security contributions
- customs duties
