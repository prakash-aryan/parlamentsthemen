id: aps_6_3_1
version: 1
source_description: The topic "Raumplanung" ("Aménagement du territoire") in the chapter "Raumplanung
  und Wohnungswesen" of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Spatial Planning
definition: Parliamentary affairs under this topic address the organization, development, and regulation
  of land use across Switzerland, balancing urban growth, environmental protection, and regional equity.
  It includes debates on zoning laws, infrastructure projects, and sustainable development strategies
  at federal, cantonal, and municipal levels.
include:
- land use zoning
- urban development
- regional planning
- environmental protection
- infrastructure projects
- sustainable development
- housing policy coordination
- transportation networks
exclude:
- individual housing subsidies
- rent control
- building permits for single structures
- municipal waste management
- local road maintenance
- school construction planning
