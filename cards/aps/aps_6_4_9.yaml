id: aps_6_4_9
version: 1
source_description: The topic "Schutz vor Naturgefahren" ("Protection contre les forces naturelles") in
  the chapter "Umweltschutz" of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Protection against Natural Hazards
definition: Parliamentary affairs under this topic focus on measures to prevent, mitigate, and respond
  to natural disasters such as floods, landslides, avalanches, and earthquakes, including infrastructure
  planning, early warning systems, and risk management policies.
include:
- flood protection infrastructure
- avalanche control measures
- landslide prevention
- early warning systems
- risk mapping and zoning
- recovery and emergency response plans
- climate change adaptation strategies
- insurance and compensation schemes for natural disasters
exclude:
- air pollution control
- waste management
- water quality regulation
- biodiversity conservation
- energy efficiency standards
- urban noise reduction
- chemical hazard regulation
