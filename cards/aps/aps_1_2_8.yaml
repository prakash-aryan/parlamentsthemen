id: aps_1_2_8
version: 1
source_description: The topic "Kantone" ("Cantons") in the chapter "Institutionen" of the domain "Akteure
  und Institutionen" in the Année Politique Suisse classification of Swiss politics. Cover what parliamentary
  affairs on this topic are typically about, and what belongs to neighbouring topics of the same chapter
  instead.
name: Cantonal Autonomy and Powers
definition: Parliamentary affairs concerning the constitutional status, competencies, and autonomy of
  Swiss cantons within the federal system, including their legislative, executive, and financial powers.
include:
- cantonal jurisdiction
- federal-cantonal division of powers
- cantonal constitutions
- cantonal administrative structures
- cantonal tax autonomy
- cantonal education systems
- cantonal police and law enforcement
- cantonal environmental regulations
exclude:
- federal legislative proposals
- national budget debates
- foreign policy matters
- direct democracy initiatives
- municipal governance issues
- inter-cantonal agreements
