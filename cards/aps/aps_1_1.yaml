id: aps_1_1
version: 1
source_description: 'The chapter "Politische Grundfragen" ("Problèmes politiques fondamentaux") of the
  domain "Akteure und Institutionen" in the Année Politique Suisse classification of Swiss politics. It
  contains these topics: Nationale Identität; Verfassungsfragen; Territorialfragen; Jurafrage. Cover what
  parliamentary affairs in this chapter are typically about.'
name: Political Foundations
definition: This topic covers core political questions concerning the identity, structure, and territorial
  integrity of Switzerland, including debates on national identity, constitutional reforms, and territorial
  organization.
