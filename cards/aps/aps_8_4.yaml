id: aps_8_4
version: 1
source_description: 'The chapter "Landwirtschaft" ("Agriculture") of the domain "Wirtschaft und Finanzen"
  in the Année Politique Suisse classification of Swiss politics. It contains these topics: Agrarpolitik;
  Beschäftigte in der Landwirtschaft; Lebensmittel; Pflanzliche Produktion; Tierische Produktion; Tierhaltung
  und Tierschutz; Tierversuche; Jagd und Fischerei; Grossraubtiere; Forstwirtschaft; Gentechnologie; Umweltschutz
  in der Landwirtschaft. Cover what parliamentary affairs in this chapter are typically about.'
name: Swiss Agricultural Policy and Practices
definition: This topic covers parliamentary discussions and decisions related to agriculture in Switzerland,
  including food production, livestock management, environmental protection in farming, and the impact
  of technology and biodiversity on agricultural practices.
