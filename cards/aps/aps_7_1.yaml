id: aps_7_1
version: 1
source_description: 'The chapter "Rechtsordnung" ("Ordre juridique") of the domain "Rechts- und Sicherheitspolitik"
  in the Année Politique Suisse classification of Swiss politics. It contains these topics: Grundrechte;
  Strafrecht; Zivilrecht; Internationales Recht; Staatsangehörigkeit; Rechtshilfe; Datenschutz. Cover
  what parliamentary affairs in this chapter are typically about.'
name: Legal System and Fundamental Rights
definition: This topic covers parliamentary debates and initiatives related to Switzerland's legal framework,
  including fundamental rights protection, criminal law, civil law, international law, citizenship, legal
  assistance between jurisdictions, and data protection.
