id: aps_8_4_7
version: 1
source_description: The topic "Tierversuche" ("Expérimentation animale") in the chapter "Landwirtschaft"
  of the domain "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Animal experimentation in agriculture
definition: Parliamentary affairs concerning the use of animals in agricultural research, testing of farming
  practices, and development of new agricultural products, including ethical considerations, regulation,
  and alternatives to animal testing.
include:
- animal testing in agricultural research
- ethical guidelines for farm animal experiments
- alternatives to animal testing in agriculture
- regulation of animal trials in farming
- impact of animal experimentation on agricultural innovation
- animal welfare in agricultural research
- public funding for agricultural animal testing
- transparency in agricultural animal trials
exclude:
- general animal welfare legislation
- wildlife conservation policies
- food safety testing outside agriculture
- animal husbandry practices
- veterinary medicine research unrelated to agriculture
- biotechnology patents unrelated to farming
