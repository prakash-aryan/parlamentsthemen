id: aps_5_1_6
version: 1
source_description: The topic "Medizinische Forschung" ("Recherche médicale") in the chapter "Gesundheit,
  Sozialhilfe, Sport" of the domain "Gesundheit und Sozialsystem" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Medical Research
definition: Parliamentary affairs under this topic focus on funding, regulation, ethical standards, and
  policy frameworks for medical research in Switzerland, including clinical trials, innovation incentives,
  and public health research priorities.
include:
- clinical trials regulation
- research funding allocation
- ethical guidelines for medical studies
- public health research priorities
- innovation incentives in healthcare
- data sharing in medical research
- collaboration between academia and industry
- regulation of new medical technologies
exclude:
- healthcare service delivery
- social welfare programs
- sports policy and funding
- drug pricing and reimbursement
- hospital infrastructure development
- public health campaigns
- social insurance schemes
