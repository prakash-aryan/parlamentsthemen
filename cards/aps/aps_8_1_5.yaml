id: aps_8_1_5
version: 1
source_description: The topic "Konsumentinnen- und Konsumentenschutz" ("Protection des consommateurs/trices")
  in the chapter "Wirtschaftspolitik" of the domain "Wirtschaft und Finanzen" in the Année Politique Suisse
  classification of Swiss politics. Cover what parliamentary affairs on this topic are typically about,
  and what belongs to neighbouring topics of the same chapter instead.
name: Consumer Protection
definition: Parliamentary affairs concerning the rights, safety, and information of consumers in the marketplace,
  including product safety, fair trade practices, and consumer rights enforcement.
include:
- product safety standards
- consumer rights enforcement
- fair trade and advertising practices
- labeling and transparency requirements
- consumer complaint mechanisms
- protection against fraud
- digital consumer rights
- consumer education programs
exclude:
- general economic policy
- financial market regulation
- taxation policy
- employment law
- intellectual property rights
- competition law
- environmental product standards
