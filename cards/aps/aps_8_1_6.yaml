id: aps_8_1_6
version: 1
source_description: The topic "Tourismus" ("Tourisme") in the chapter "Wirtschaftspolitik" of the domain
  "Wirtschaft und Finanzen" in the Année Politique Suisse classification of Swiss politics. Cover what
  parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics of
  the same chapter instead.
name: Tourism Policy
definition: Parliamentary affairs concerning the promotion, regulation, and economic impact of tourism
  within Switzerland, including infrastructure, sustainability, regional development, and visitor management.
include:
- tourism infrastructure development
- sustainable tourism practices
- regional tourism promotion
- visitor management and capacity limits
- economic impact of tourism
- tourism-related taxation and funding
- seasonal employment in tourism
- tourism marketing and branding
exclude:
- general economic growth policies
- financial market regulation
- industrial sector support
- agricultural subsidies
- trade agreements
- monetary policy
- banking regulation
