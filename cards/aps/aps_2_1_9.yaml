id: aps_2_1_9
version: 1
source_description: The topic "Politikfinanzierung" ("Financement de la politique") in the chapter "Direkte
  Demokratie" of the domain "Direkte Demokratie und Wahlen" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Political Financing
definition: Parliamentary affairs on political financing examine the funding mechanisms for political
  parties, election campaigns, and democratic processes, including transparency, limits on donations,
  public subsidies, and the regulation of campaign spending.
include:
- party funding transparency
- campaign finance limits
- public subsidies to political parties
- donation regulations
- financial reporting requirements
- equality in campaign financing
- anti-corruption measures in funding
- regulation of third-party spending
exclude:
- electoral system design
- voting procedures
- ballot initiative rules
- referendum organization
- parliamentary immunity
- civil service neutrality
