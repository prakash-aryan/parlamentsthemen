id: aps_5_1_1
version: 1
source_description: The topic "Gesundheitspolitik" ("Politique de la santé") in the chapter "Gesundheit,
  Sozialhilfe, Sport" of the domain "Gesundheit und Sozialsystem" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Health Policy
definition: Parliamentary affairs concerning the organization, financing, and regulation of the healthcare
  system in Switzerland, including access to care, public health measures, and the role of different levels
  of government in health services.
include:
- healthcare financing
- public health programs
- medical services regulation
- healthcare infrastructure
- drug policy and approval
- preventive health measures
- health insurance systems
- cross-border medical care
exclude:
- social welfare benefits
- sports policy and funding
- disability support services
- elderly care facilities
- youth health programs
- school health services
