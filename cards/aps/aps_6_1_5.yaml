id: aps_6_1_5
version: 1
source_description: The topic "Luftfahrt" ("Trafic aérien") in the chapter "Verkehr und Kommunikation"
  of the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Aviation
definition: Parliamentary affairs concerning the regulation, safety, infrastructure, and environmental
  impact of civil and military aviation within Switzerland, including airport operations, air traffic
  management, and aviation policy.
include:
- airport infrastructure development
- aviation safety regulations
- air traffic management
- aviation noise pollution
- aviation emissions and climate impact
- civil aviation policy
- military aviation coordination
- aviation industry support
exclude:
- road transport policy
- rail transport infrastructure
- public transit systems
- maritime transport regulations
- telecommunications networks
- postal services
