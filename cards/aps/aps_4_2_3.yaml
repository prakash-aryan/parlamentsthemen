id: aps_4_2_3
version: 1
source_description: The topic "Mittelschulen" ("Enseignement secondaire supérieur") in the chapter "Bildung
  und Forschung" of the domain "Gesellschaft und Kultur" in the Année Politique Suisse classification
  of Swiss politics. Cover what parliamentary affairs on this topic are typically about, and what belongs
  to neighbouring topics of the same chapter instead.
name: Secondary Education
definition: Parliamentary affairs concerning the organization, funding, curriculum, and quality of secondary
  schools in Switzerland, including vocational, academic, and general education tracks.
include:
- secondary school curriculum
- vocational education and training
- school funding and subsidies
- teacher training and qualifications
- equality in access to secondary education
- integration of students with special needs
- digitalization in secondary schools
- language education at secondary level
exclude:
- primary education
- higher education and universities
- adult education and continuing training
- research funding and innovation
- cultural policy and heritage
- youth welfare and child protection
