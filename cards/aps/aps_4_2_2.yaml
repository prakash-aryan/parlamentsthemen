id: aps_4_2_2
version: 1
source_description: The topic "Berufsbildung" ("Formation professionnelle") in the chapter "Bildung und
  Forschung" of the domain "Gesellschaft und Kultur" in the Année Politique Suisse classification of Swiss
  politics. Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Vocational Education and Training
definition: Parliamentary affairs on vocational education and training focus on the development, funding,
  regulation, and quality assurance of apprenticeship systems, vocational schools, and continuing education
  programs within Switzerland's dual education model.
include:
- apprenticeship programs
- vocational schools
- dual education system
- continuing vocational training
- skills development
- labor market integration
- teacher training for vocational education
- equality in access to vocational paths
exclude:
- higher education institutions
- university research funding
- primary and secondary school curricula
- general adult education
- cultural heritage preservation
- arts and creative industries funding
