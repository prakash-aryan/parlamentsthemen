id: aps_4_1
version: 1
source_description: 'The chapter "Soziale Gruppen" ("Groupes sociaux") of the domain "Gesellschaft und
  Kultur" in the Année Politique Suisse classification of Swiss politics. It contains these topics: Bevölkerungsentwicklung;
  Migration; Asylwesen; Frauen- und Gleichstellungsfragen; Familien; Kinder und Jugendliche; Altersfragen;
  LGBTQIA+; Menschen mit Behinderungen; Fahrende. Cover what parliamentary affairs in this chapter are
  typically about.'
name: Social Groups
definition: This topic covers parliamentary discussions and legislative matters related to the composition,
  rights, and well-being of various social groups within Swiss society, including demographic trends,
  migration, asylum, gender equality, family policies, youth and children's issues, aging populations,
  LGBTQIA+ rights, disability inclusion, and the specific needs of the traveling community.
include:
- Population development
- Migration
- Asylum policy
- Gender equality
- Family policies
- Youth and children's issues
- Aging and elderly care
- LGBTQIA+ rights
- Disability inclusion
- Rights of the traveling community
exclude:
- Economic policy
- Environmental regulations
- Infrastructure development
- Foreign policy
- Taxation
- Labor market regulations
- Healthcare system organization
