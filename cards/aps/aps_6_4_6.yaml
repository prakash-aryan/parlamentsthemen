id: aps_6_4_6
version: 1
source_description: The topic "Klimapolitik" ("Politique climatique") in the chapter "Umweltschutz" of
  the domain "Infrastruktur und Umwelt" in the Année Politique Suisse classification of Swiss politics.
  Cover what parliamentary affairs on this topic are typically about, and what belongs to neighbouring
  topics of the same chapter instead.
name: Climate Policy
definition: Parliamentary affairs concerning Switzerland's strategies, measures, and legislation to mitigate
  climate change, reduce greenhouse gas emissions, and adapt to its impacts. This includes debates on
  national and international climate commitments, renewable energy transitions, carbon pricing mechanisms,
  and environmental sustainability standards.
include:
- national climate targets
- greenhouse gas reduction strategies
- renewable energy promotion
- carbon pricing and emissions trading
- climate adaptation measures
- international climate agreements implementation
- sustainable infrastructure development
- environmental impact assessments
exclude:
- waste management
- nuclear energy regulation
- water resource management
- biodiversity conservation
- air quality control
- chemical substance regulation
