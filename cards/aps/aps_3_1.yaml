id: aps_3_1
version: 1
source_description: 'The chapter "Europa- und Aussenpolitik" ("Politique européenne et étrangère") of
  the domain "Europa- und Aussenpolitik" in the Année Politique Suisse classification of Swiss politics.
  It contains these topics: Beziehungen zur EU; Zwischenstaatliche Beziehungen; Beziehungen zu internationalen
  Organisationen; Neutralität; Gute Dienste; Aussenwirtschaftspolitik; Entwicklungspolitik; Auslandschweizerinnen
  und -schweizer. Cover what parliamentary affairs in this chapter are typically about.'
name: Swiss Foreign and European Policy
definition: This topic covers parliamentary debates and motions related to Switzerland's external relations,
  including its stance on the European Union, bilateral agreements with other states, engagement with
  international organizations, the principle of neutrality, diplomatic mediation efforts, trade policy
  with foreign nations, development aid programs, and support for Swiss citizens living abroad.
include:
- Relations with the EU
- Bilateral state relations
- Relations with international organizations
- Swiss neutrality
- Good offices (mediation)
- Foreign economic policy
- Development policy
- Swiss citizens abroad
exclude:
- Domestic social policy
- Environmental regulations
- Education system reforms
- Healthcare services
- Infrastructure projects
- Taxation policy
- Labor market regulations
