id: aps_7_1_3
version: 1
source_description: The topic "Zivilrecht" ("Droit civil") in the chapter "Rechtsordnung" of the domain
  "Rechts- und Sicherheitspolitik" in the Année Politique Suisse classification of Swiss politics. Cover
  what parliamentary affairs on this topic are typically about, and what belongs to neighbouring topics
  of the same chapter instead.
name: Civil Law
definition: Parliamentary affairs concerning the body of law governing private rights and obligations
  between individuals, including family law, property law, inheritance law, and obligations arising from
  contracts or torts.
include:
- family law
- property rights
- inheritance and succession
- contractual obligations
- tort law and liability
- civil procedure
- legal capacity and guardianship
exclude:
- criminal law
- administrative law
- constitutional law
- international law
- tax law
- labour law
