id: adhoc_climate
version: 1
source_description: 'Climate change: parliamentary affairs about climate change and climate policy, including
  greenhouse gas reduction, net zero targets, the CO2 law, climate adaptation, extreme weather caused
  by climate change, climate protection in transport, buildings, agriculture and finance, and climate
  strikes. Excludes general environmental protection without a climate aspect.'
name: Climate Change Policy
definition: Parliamentary motions, postulates, interpellations, and questions concerning climate change
  mitigation, adaptation strategies, and climate-related legislation, including targets for greenhouse
  gas reduction, net zero goals, implementation of the CO2 law, and sector-specific climate protection
  measures.
include:
- greenhouse gas reduction targets
- net zero commitments
- CO2 law implementation
- climate adaptation measures
- extreme weather response
- climate protection in transport
- climate action in buildings
- agriculture and climate change
- finance and climate policy
- climate strikes and public engagement
exclude:
- general environmental protection
- waste management
- biodiversity conservation
- water quality regulation
- air pollution unrelated to climate change
- general energy policy without climate focus
