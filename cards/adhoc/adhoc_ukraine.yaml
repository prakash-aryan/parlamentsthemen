id: adhoc_ukraine
version: 1
source_description: 'War in Ukraine: parliamentary affairs about the Russian war against Ukraine and its
  consequences for Switzerland, including sanctions against Russia, neutrality and arms re-export questions,
  refugees from Ukraine and protection status S, humanitarian aid and reconstruction, and economic effects
  of the war. Excludes foreign policy unrelated to this war.'
name: Swiss Response to the War in Ukraine
definition: Parliamentary affairs concerning Switzerland's stance, policies, and actions related to the
  Russian war against Ukraine, including sanctions, neutrality implications, arms re-export, refugee protection,
  humanitarian aid, and economic impacts.
include:
- sanctions against Russia
- neutrality and arms re-export
- refugees from Ukraine
- protection status S
- humanitarian aid
- reconstruction support
- economic effects of the war
exclude:
- general foreign policy
- conflicts unrelated to Ukraine
- domestic issues with no Ukraine link
