id: adhoc_housing
version: 1
source_description: 'Housing shortage and rents: parliamentary affairs about the shortage of affordable
  housing, rising rents and housing costs, reference interest rates, non-profit and cooperative housing,
  densification to create more housing, second homes and short-term rentals as they affect housing supply,
  and tenant protection. Excludes construction law or spatial planning without a housing supply aspect.'
name: Housing Affordability and Supply
definition: Parliamentary affairs addressing the shortage of affordable housing, rising rents and housing
  costs, reference interest rates affecting housing finance, promotion of non-profit and cooperative housing
  models, densification strategies to increase housing stock, and the impact of second homes and short-term
  rentals on housing availability, alongside tenant protection measures.
include:
- affordable housing shortage
- rising rents
- housing costs
- reference interest rates
- non-profit housing
- cooperative housing
- urban densification
- second homes
- short-term rentals
- tenant protection
exclude:
- general construction law
- spatial planning without housing supply focus
- building permits
- zoning regulations
