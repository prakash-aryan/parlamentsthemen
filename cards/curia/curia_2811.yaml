id: curia_2811
version: 1
source_description: 'The subject area "Migration" (French: "Politique migratoire", Italian: "Migrazione")
  that the Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover
  what affairs in this subject area are typically about.'
name: Swiss Migration Policy
definition: This topic covers parliamentary affairs related to Switzerland's policies on immigration,
  asylum, integration of foreign nationals, border controls, and the legal framework governing the movement
  and residence of people within Switzerland.
include:
- immigration rules
- asylum procedures
- integration programs
- border security
- residency permits
- refugee status
- foreign worker regulations
exclude:
- domestic labor market
- criminal law
- taxation
- environmental policy
- education system
- healthcare services
