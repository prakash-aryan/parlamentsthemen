id: curia_2846
version: 1
source_description: 'The subject area "Raumplanung und Wohnungswesen" (French: "Aménagement du territoire
  et logement", Italian: "Pianificazione territoriale e alloggi") that the Swiss Parliamentary Services
  assign to federal parliamentary affairs in Curia Vista. Cover what affairs in this subject area are
  typically about.'
name: Spatial Planning and Housing
definition: This topic covers parliamentary affairs related to the organization and development of land
  use, urban development, and housing policies at the federal level in Switzerland. It includes debates
  on zoning laws, sustainable construction, affordable housing initiatives, and the balance between urban
  and rural development.
