id: curia_44
version: 1
source_description: 'The subject area "Beschäftigung und Arbeit" (French: "Emploi et travail", Italian:
  "Occupazione e lavoro") that the Swiss Parliamentary Services assign to federal parliamentary affairs
  in Curia Vista. Cover what affairs in this subject area are typically about.'
name: Employment and Labor
definition: This subject area encompasses parliamentary affairs related to labor market policies, working
  conditions, employment rates, vocational training, social security for workers, and measures to combat
  unemployment and promote job creation in Switzerland.
include:
- labor market policies
- working conditions
- employment rates
- vocational training
- social security for workers
- unemployment measures
- job creation initiatives
exclude:
- healthcare policy
- education system
- environmental regulations
- taxation
- immigration policy
- housing policy
