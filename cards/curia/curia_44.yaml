  de:
  - Arbeitsmarktpolitik
  - Arbeitsbedingungen
  - Beschäftigungsrate
  - Berufsbildung
  - Arbeitnehmerschutz
  - Arbeitslosenversicherung
  - Arbeitsplatzförderung
  fr:
  - politique de l'emploi
  - conditions de travail
  - taux d'emploi
  - formation professionnelle
  - protection des travailleurs
  - assurance-chômage
  - création d'emplois
  it:
