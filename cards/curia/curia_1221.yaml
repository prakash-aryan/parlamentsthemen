id: curia_1221
version: 1
source_description: 'The subject area "Gerichtswesen" (French: "Justice", Italian: "Giustizia") that the
  Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover what affairs
  in this subject area are typically about.'
name: Swiss Justice System
definition: This topic covers parliamentary affairs related to the administration of justice, legal frameworks,
  court organization, and the functioning of the judicial branch in Switzerland. It includes discussions
  on legislation affecting courts, legal procedures, access to justice, and the independence of the judiciary.
include:
- court organization
- judicial independence
- legal procedures
- access to justice
- criminal law
- civil law
- administrative courts
- judge appointments
exclude:
- education policy
- healthcare services
- taxation
- transport infrastructure
- environmental regulations
- social welfare programs
- defense and security
