id: curia_34
version: 1
source_description: 'The subject area "Medien und Kommunikation" (French: "Médias et communication", Italian:
  "Media e comunicazione") that the Swiss Parliamentary Services assign to federal parliamentary affairs
  in Curia Vista. Cover what affairs in this subject area are typically about.'
name: Media and Communication
definition: This topic covers parliamentary affairs related to the functioning, regulation, and impact
  of media and communication systems in Switzerland. It includes discussions on press freedom, media diversity,
  digital communication platforms, information policy, and the role of public and private media in democratic
  processes. It also encompasses issues related to transparency, access to information, and the responsibilities
  of media in society.
include:
- press freedom
- media regulation
- digital communication
- information policy
- media diversity
- transparency in government
- public information campaigns
- social media governance
exclude:
- criminal law
- intellectual property
- copyright issues
- telecommunications infrastructure
- data protection
- privacy laws
