id: curia_2446
version: 1
source_description: 'The subject area "Steuer" (French: "Fiscalité", Italian: "Imposte") that the Swiss
  Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover what affairs in
  this subject area are typically about.'
name: Taxation
definition: This topic covers parliamentary affairs related to the design, implementation, and administration
  of taxes at federal, cantonal, and municipal levels in Switzerland. It includes discussions on tax rates,
  exemptions, compliance, revenue generation, and the impact of taxation on individuals, businesses, and
  the economy. It also encompasses debates on tax fairness, efficiency, and reforms to align with economic
  and social policy goals.
