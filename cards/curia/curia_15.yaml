id: curia_15
version: 1
source_description: 'The subject area "Wirtschaft" (French: "Économie", Italian: "Economia") that the
  Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover what affairs
  in this subject area are typically about.'
name: Economic Affairs
definition: This topic covers parliamentary matters related to Switzerland's economic policy, including
  financial markets, trade, industry, employment, innovation, and fiscal measures. It encompasses debates
  and proposals on economic development, competitiveness, and the regulation of economic activities at
  the federal level.
include:
- economic policy
- financial markets
- trade agreements
- industrial development
- employment and labor market
- innovation and technology
- fiscal and monetary policy
- competitiveness
- economic regulation
exclude:
- environmental policy
- social welfare
- education policy
- healthcare policy
- cultural affairs
- transport infrastructure
- agricultural policy
