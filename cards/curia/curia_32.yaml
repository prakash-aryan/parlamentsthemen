id: curia_32
version: 1
source_description: 'The subject area "Bildung" (French: "Éducation", Italian: "Formazione") that the
  Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover what affairs
  in this subject area are typically about.'
name: Education Policy
definition: This topic covers parliamentary affairs related to the Swiss education system, including school
  curricula, vocational training, higher education, language policies in schools, and the role of federal,
  cantonal, and municipal authorities in education governance.
include:
- school curricula
- vocational training
- higher education
- language education
- educational standards
- teacher training
- school infrastructure
- equal access to education
exclude:
- healthcare policy
- social welfare programs
- cultural funding
- transportation infrastructure
- environmental regulations
- economic development
- immigration policy
