id: curia_55
version: 1
source_description: 'The subject area "Landwirtschaft" (French: "Agriculture", Italian: "Agricoltura")
  that the Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover
  what affairs in this subject area are typically about.'
name: Swiss Agriculture Policy
definition: This topic covers parliamentary affairs related to farming practices, rural development, food
  security, agricultural subsidies, environmental sustainability in farming, livestock management, and
  the economic viability of Swiss agriculture.
include:
- farming practices
- rural development
- food security
- agricultural subsidies
- environmental sustainability in farming
- livestock management
- economic viability of agriculture
exclude:
- urban planning
- industrial manufacturing
- international trade agreements (unless agriculture-specific)
- forestry management
- fisheries
