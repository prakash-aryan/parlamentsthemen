id: curia_24
version: 1
source_description: 'The subject area "Finanzwesen" (French: "Finances", Italian: "Finanze") that the
  Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover what affairs
  in this subject area are typically about.'
name: Public Finance and Budgetary Affairs
definition: This topic covers parliamentary matters related to the management, allocation, and oversight
  of public funds at federal, cantonal, and city levels. It includes debates on budget planning, revenue
  generation, expenditure control, financial regulations, and fiscal policy impacts on the economy and
  society.
include:
- federal budget
- taxation
- public spending
- debt management
- financial regulations
- budgetary oversight
- revenue allocation
- fiscal policy
exclude:
- environmental policy
- education policy
- healthcare policy
- transport infrastructure
- cultural funding
- social welfare programs
- immigration policy
