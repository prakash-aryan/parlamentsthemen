id: curia_421
version: 1
source_description: 'The subject area "Parlament" (French: "Parlement", Italian: "Parlamento") that the
  Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover what affairs
  in this subject area are typically about.'
name: General Parliamentary Affairs
definition: This subject area encompasses broad, overarching matters related to the functioning, organization,
  and procedures of the Swiss parliament at the federal level. It includes topics that do not fall under
  more specific categories such as legislation, budget, or specific policy areas. It covers the institutional
  framework, parliamentary rules, and general governance aspects.
include:
- Parliamentary rules and procedures
- Institutional organization of parliament
- Parliamentary sessions and agendas
- Speaker and leadership roles
- Parliamentary services and administration
- Interparliamentary relations
- Parliamentary privileges and immunities
- General governance and oversight
exclude:
- Specific legislative proposals
- Budgetary matters
- Policy-specific debates
- Committee-specific investigations
- International treaties
- Cabinet appointments
