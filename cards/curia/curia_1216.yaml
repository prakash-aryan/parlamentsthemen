id: curia_1216
version: 1
source_description: 'The subject area "Strafrecht" (French: "Droit pénal", Italian: "Diritto penale")
  that the Swiss Parliamentary Services assign to federal parliamentary affairs in Curia Vista. Cover
  what affairs in this subject area are typically about.'
name: Criminal Law
definition: This topic covers parliamentary affairs related to the formulation, amendment, and interpretation
  of criminal legislation at the federal level in Switzerland. It includes discussions on penalties, criminal
  procedures, and the protection of victims within the Swiss legal framework. Matters may also address
  the balance between security, individual rights, and the effectiveness of criminal justice.
