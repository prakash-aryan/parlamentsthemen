<style>
  :root {
    --paper: #f6f4ef;
    --card: #ffffff;
    --ink: #111111;
    --grey: #6d6a64;
    --hair: #d9d5cc;
    --red: #e3000f;
    --yes: #0a8f4d;
    --amber: #b97700;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 64px;
    --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
    --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--font-body); padding-left: max(16px, 2.5vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 2.5vw, env(safe-area-inset-right, 0px)); padding-block: 0 var(--s5); }
  .page { width: 100%; }
  [hidden] { display: none !important; }
  .topbar { display: flex; justify-content: space-between; gap: var(--s1) var(--s2); padding-block: var(--s2); border-bottom: 2px solid var(--ink); font: 600 12px/1.5 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; flex-wrap: wrap; }
  .topbar span:last-child { color: var(--red); }

  .hero { position: relative; display: grid; align-content: start; min-height: clamp(400px, 52vh, 640px); overflow: hidden; border-bottom: 2px solid var(--ink); cursor: crosshair; touch-action: pan-y; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-text { position: relative; display: grid; gap: var(--s3); justify-items: start; padding-block: var(--s3) var(--s4); pointer-events: none; }
  .hero h1 { margin: 0; font: 900 clamp(56px, 10vw, 220px)/.82 var(--font-display); font-stretch: 68%; letter-spacing: -.02em; text-transform: uppercase; }
  html:not([lang="de"]) .hero h1 { font-size: clamp(40px, 8vw, 180px); }
  .hero h1 em { font-style: normal; color: var(--red); display: block; }
  .hero .lede { margin: 0; padding-left: .06em; font: 500 20px/1.35 var(--font-body); max-width: 40ch; text-wrap: balance; }
  .langs { display: flex; gap: 4px; pointer-events: auto; cursor: default; padding: 2px; }
  .langs button { font: 600 14px/1 var(--font-mono); letter-spacing: .06em; padding: 7px 10px 6px; border: 1.5px solid transparent; background: transparent; color: var(--grey); cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
  .langs button:hover { color: var(--ink); }
  .langs .sep { width: 1.5px; background: var(--hair); margin: 4px 6px; }
  .langs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--card); }
  .langs button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

  .num { font: 600 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
  .field { display: grid; gap: var(--s1); }
  select, input { width: 100%; padding: 11px 12px; border: 1.5px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); font: 500 15px/1.35 var(--font-body); }
  select:focus, input:focus { outline: 3px solid var(--red); outline-offset: 1px; }
  .go { padding: var(--s2) 20px; border: 0; background: var(--red); color: #fff; font: 800 20px/1 var(--font-display); font-stretch: 75%; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background .15s, letter-spacing .2s; }
  .go:hover { background: var(--ink); letter-spacing: .07em; }
  .go[disabled] { cursor: progress; background: var(--grey); }
  .go:focus-visible, .flag:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .note { margin: 0; font-size: 14px; color: var(--grey); max-width: 70ch; }
  .fnote { margin: 0; padding: var(--s1) var(--s2); border-left: 4px solid var(--amber); background: var(--card); font-size: 14px; max-width: 80ch; }
  select option:disabled { color: var(--hair); }

  .finder { margin-top: var(--s5); display: grid; gap: var(--s2); }
  .finder > h2 { margin-bottom: var(--s1); }
  .finder > .filters { margin-top: var(--s1); }
  .finder h2 { margin: 0; font: 800 clamp(30px, 3.6vw, 52px)/1 var(--font-display); font-stretch: 75%; text-transform: uppercase; text-wrap: balance; }
  .sbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; border: 2px solid var(--ink); background: var(--card); }
  .sbar input { border: 0; padding: 18px 20px; font: 500 clamp(18px, 2vw, 24px)/1.2 var(--font-body); background: var(--card); color: var(--ink); min-width: 0; }
  .sbar input:focus { outline: 3px solid var(--red); outline-offset: -3px; }
  .sbar .go { min-width: 200px; gap: var(--s2); }
  .examples { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .examples button { border: 1.5px solid var(--ink); background: transparent; padding: var(--s1) 12px; font: 500 14px/1.2 var(--font-body); color: var(--ink); cursor: pointer; transition: background .15s, color .15s; }
  .examples button:hover { background: var(--ink); color: var(--paper); }
  .filters { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.2fr) minmax(0, .7fr) minmax(0, .7fr); gap: var(--s2); }
  .filters .field > span { font: 600 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--grey); }
  .rcount { margin: var(--s2) 0 0; font: 600 12px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--grey); }
  .hits { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .hits:empty { border-top: 0; }
  .hit { border-bottom: 1.5px solid var(--hair); }
  .hit.open { background: var(--card); margin-inline: calc(-1 * var(--s2)); padding-inline: var(--s2); }
  .hit-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1) var(--s3); text-align: left; background: none; border: 0; padding: var(--s3) 0; cursor: pointer; color: var(--ink); }
  .hit-title { font: 700 clamp(16px, 1.4vw, 19px)/1.3 var(--font-body); text-wrap: pretty; }
  .hit-head:hover .hit-title { text-decoration: underline; text-underline-offset: 3px; }
  .hit-head:focus-visible { outline: 3px solid var(--red); outline-offset: -3px; }
  .hit-meta { grid-column: 1; font: 500 12px/1.5 var(--font-mono); color: var(--grey); letter-spacing: .02em; }
  .hit-side { grid-column: 2; grid-row: 1 / span 2; display: grid; justify-items: end; align-content: start; gap: var(--s1); }
  .hit-body { padding: 0 0 var(--s4); display: grid; gap: var(--s3); max-width: 1100px; }
  .tag { font: 700 11px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; padding: 6px var(--s1); border: 1.5px solid currentColor; white-space: nowrap; }
  .tag.yes { color: var(--yes); } .tag.likely, .tag.unsure { color: var(--amber); } .tag.no { color: var(--grey); }
  .facts { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .facts span { font: 600 12px/1.3 var(--font-mono); padding: var(--s1) 12px; border: 1.5px solid var(--ink); letter-spacing: .04em; background: var(--card); }
  .verdict-line { margin: 0; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; font-size: 14px; color: var(--grey); }
  .evidence { border-left: 6px solid var(--red); padding: var(--s1) 0 var(--s1) var(--s2); font-size: 15px; line-height: 1.6; max-height: 200px; overflow: auto; }
  mark { background: #ffe066; color: inherit; padding: 0 2px; }
  .reason { margin: 0; font: 500 15px/1.45 var(--font-body); }
  .reason b { font: 600 12px/1 var(--font-mono); color: var(--red); letter-spacing: .08em; text-transform: uppercase; margin-right: 8px; }
  .topics { display: grid; gap: var(--s1); }
  .topics ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--s1); }
  .pill { display: inline-flex; align-items: stretch; border: 1.5px solid currentColor; background: var(--card); }
  .pill.yes { color: var(--yes); } .pill.likely { color: var(--amber); }
  .pill button { border: 0; background: none; color: inherit; cursor: pointer; text-align: left; font: 700 12px/1 var(--font-mono); letter-spacing: .04em; padding: var(--s1) 10px; }
  .pill .pick { text-transform: uppercase; }
  .pill .pick:hover { text-decoration: underline; }
  .pill .wrong { border-left: 1.5px solid currentColor; color: var(--grey); font-weight: 600; font-size: 11px; white-space: nowrap; }
  .pill .wrong:hover { background: var(--red); color: #fff; }
  .pill .done { white-space: nowrap; padding: var(--s1) 10px; border-left: 1.5px solid currentColor; font: 600 11px/1 var(--font-mono); color: var(--grey); }
  .links { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
  .links a, .links button { border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); padding: 10px 14px; font: 700 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: background .15s, color .15s; }
  .links a:hover, .links button:hover { background: var(--ink); color: var(--paper); }
  .links .flag:hover { background: var(--red); border-color: var(--red); color: #fff; }
  .flagged { font: 600 12px/1.4 var(--font-mono); color: var(--yes); letter-spacing: .04em; }
  .similar { display: grid; gap: var(--s1); }
  .similar ol { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1.5px solid var(--ink); }
  .similar button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--hair); padding: 10px 0; cursor: pointer; color: var(--ink); font: 500 14px/1.35 var(--font-body); }
  .similar button:hover .t { text-decoration: underline; }
  .similar .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .similar .w { font: 400 12px/1 var(--font-mono); color: var(--grey); }
  footer { margin-top: var(--s5); padding-top: var(--s2); border-top: 2px solid var(--ink); font: 400 12px/1.4 var(--font-mono); color: var(--grey); }

  @media (max-width: 880px) {
    .filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .sbar { grid-template-columns: 1fr; } .sbar .go { width: 100%; min-width: 0; }
    .hit-head { grid-template-columns: 1fr; } .hit-side { grid-column: 1; grid-row: auto; justify-items: start; }
    .hero { min-height: 420px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<div class="page">
  <div class="topbar"><span id="topleft"></span><span data-i="topright"></span></div>

  <header class="hero" id="hero">
    <canvas id="alps" aria-hidden="true"></canvas>
    <div class="hero-text">
      <nav class="langs" id="langs" aria-label="Sprache"></nav>
      <h1><span data-i="h1a"></span><em data-i="h1b"></em></h1>
      <p class="lede" data-i="lede"></p>
    </div>
  </header>

  <section class="finder" id="finder">
    <span class="num" data-i="s_num"></span>
    <h2 data-i="s_h2"></h2>
    <form class="sbar" id="sform" autocomplete="off" role="search">
      <input id="q" type="search" aria-labelledby="sgo">
      <button class="go" id="sgo" type="submit"><span data-i="s_go"></span><span aria-hidden="true">→</span></button>
    </form>
    <div class="examples" id="examples"></div>
    <div class="filters">
      <label class="field"><span data-i="f_topic"></span><select id="topic"></select></label>
      <label class="field"><span data-i="f_level"></span><select id="level"></select></label>
      <label class="field"><span data-i="f_from"></span><input id="yfrom" type="number" inputmode="numeric" min="1950" max="2026" placeholder="1990"></label>
      <label class="field"><span data-i="f_to"></span><input id="yto" type="number" inputmode="numeric" min="1950" max="2026" placeholder="2026"></label>
    </div>
    <p class="fnote" id="fnote" aria-live="polite" hidden></p>
    <p class="note" data-i="r_hint"></p>
    <p class="rcount" id="rcount" aria-live="polite"></p>
    <p class="note" id="rnote" hidden></p>
    <ol class="hits" id="hits"></ol>
  </section>

  <footer data-i="footer"></footer>
</div>

    const R = Math.max(44, Math.min(80, W * .065)) * (.8 + .2 * ptr.vis), top = skyTop(), bottom = skyBottom(), seen = [];
    if (ptr.vis > .01) {
      const lens = ctx.createRadialGradient(ptr.rx, ptr.ry, R * .2, ptr.rx, ptr.ry, R);
      lens.addColorStop(0, `rgba(255,255,255,${.7 * ptr.vis})`); lens.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = lens; ctx.beginPath(); ctx.arc(ptr.rx, ptr.ry, R, 0, 7); ctx.fill();
      ctx.strokeStyle = `rgba(17,17,17,${.16 * ptr.vis})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(ptr.rx, ptr.ry, R, 0, 7); ctx.stroke();
      ctx.beginPath();
      for (let a = 0; a < 4; a++) {
        const c = Math.cos(a * Math.PI / 2 + t * .0002), sn = Math.sin(a * Math.PI / 2 + t * .0002);
        ctx.moveTo(ptr.rx + c * (R + 3), ptr.ry + sn * (R + 3)); ctx.lineTo(ptr.rx + c * (R + 8), ptr.ry + sn * (R + 8));
      }
      ctx.strokeStyle = `rgba(17,17,17,${.35 * ptr.vis})`; ctx.stroke();
    }
    if (!reduce && rnd() < .012 * k) parts[Math.floor(rnd() * parts.length)].read = 1;
    parts.forEach((p) => {
      if (!reduce) {
        p.vx += ((.32 + .22 * Math.sin(p.y * .01 + t * .0003)) - p.vx) * .02 * k;
        p.vy += (Math.sin(p.x * .008 + t * .0005 + p.ph) * .16 - p.vy) * .02 * k;
        if (p.y < top) p.vy += .03 * k;
        if (p.y > bottom) p.vy -= .03 * k;
      }
      const dx = p.x - ptr.rx, dy = p.y - ptr.ry, d = Math.hypot(dx, dy) || 1;
      if (ptr.vis > .3 && d < R) {
        p.read = Math.min(1, p.read + .07 * k);
        if (!reduce) { p.vx += (-dy / d) * .02 * k; p.vy += (dx / d) * .02 * k; }
        seen.push([d, p]);
      } else p.read = Math.max(0, p.read - .003 * k);
      if (!reduce) { p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k; }
      if (p.x > W + 12) Object.assign(p, spawn(-10, top + rnd() * (bottom - top)));
      if (p.x < -14) p.x = W + 10;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.read > .02 ? mix("#ffffff", TOPIC_COLOURS[p.topic], p.read) : "#ffffff";
      ctx.strokeStyle = "rgba(17,17,17,.32)"; ctx.lineWidth = .8;
      ctx.fillRect(-3.5, -4.5, 7, 9); ctx.strokeRect(-3.5, -4.5, 7, 9);
      ctx.beginPath(); ctx.moveTo(-1.8, -2); ctx.lineTo(1.8, -2); ctx.moveTo(-1.8, 0); ctx.lineTo(1.8, 0); ctx.moveTo(-1.8, 2); ctx.lineTo(.8, 2);
      ctx.strokeStyle = p.read > .5 ? "rgba(255,255,255,.8)" : "rgba(17,17,17,.2)"; ctx.stroke();
      ctx.restore();
    });

    if (pinned && t > pinnedUntil) pinned = null;
    seen.sort((a, b) => a[0] - b[0]);
    const tags = (pinned ? [[1, pinned]] : []).concat(seen.filter(([, p]) => p !== pinned && p.read > .5).map(([, p]) => [ptr.vis * (p.read - .5) * 2, p]));
    ctx.font = `600 10px "JetBrains Mono", ui-monospace, monospace`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    const placed = [];
    for (const [alpha, p] of tags) {
      if (placed.length >= (pinned ? 1 : 3) || alpha <= .02) break;
      const label = T().canvas[p.topic].toUpperCase(), w = ctx.measureText(label).width + 10, h = 16;
      const x = p.x + 9 + w > W ? p.x - 9 - w : p.x + 9, y = p.y - h / 2;
      if (placed.some((r) => x < r.x + r.w + 4 && x + w + 4 > r.x && y < r.y + r.h + 3 && y + h + 3 > r.y)) continue;
      placed.push({x, y, w, h});
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(255,255,255,.94)"; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = TOPIC_COLOURS[p.topic]; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      ctx.fillStyle = TOPIC_COLOURS[p.topic]; ctx.fillText(label, x + 5, y + h / 2 + .5);
      if (p === pinned) { ctx.beginPath(); ctx.arc(p.x, p.y, 9 + 2 * Math.sin(t * .008), 0, 7); ctx.stroke(); }
    }
    ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  }

  const loop = (t) => { if (running) draw(t); requestAnimationFrame(loop); };
  const at = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  hero.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    if (e.target.closest(".langs")) { ptr.active = false; return; }
    [ptr.tx, ptr.ty] = at(e);
    if (ptr.vis < .05) { ptr.rx = ptr.tx; ptr.ry = ptr.ty; }
    ptr.active = true;
  });
  hero.addEventListener("pointerleave", () => { ptr.active = false; });
  hero.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".langs")) return;
    const [x, y] = at(e); ptr.tx = x; ptr.ty = y;
    if (ptr.vis < .05) { ptr.rx = x; ptr.ry = y; }
    ptr.active = true; ptr.until = e.pointerType === "mouse" ? 0 : performance.now() + 2500;
    let best = null, bd = 34;
    parts.forEach((q) => { const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = q; } });
    if (best) { pinned = best; pinnedUntil = performance.now() + 3500; best.read = 1; best.vx *= .2; best.vy *= .2; }
  });
  new ResizeObserver(resize).observe(hero);
  resize();
  if (!reduce) {
    new IntersectionObserver(([en]) => { running = en.isIntersecting && !document.hidden; }).observe(hero);
    document.addEventListener("visibilitychange", () => { running = !document.hidden; });
    requestAnimationFrame(loop);
  }
})();

function highlight(text, quote) {
  const t = esc(text || ""); if (!quote) return t;
  const q = esc(quote), i = t.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? `${t} <mark>${q}</mark>` : `${i > 220 ? "… " : ""}${t.slice(Math.max(0, i - 220), i)}<mark>${t.slice(i, i + q.length)}</mark>${t.slice(i + q.length, i + q.length + 420)} …`;
}

const topicName = (id, names) => {
  const L = T(); if (L.adhoc[id]) return L.adhoc[id];
  const m = names ? {names} : TOPICS_META.find((x) => x.id === id);
  return m ? (m.names?.[LANG] || m.name || id) : id;
};
const scopeOf = (id) => (TOPICS_META.find((x) => x.id === id) || {}).scope || null;
const verdict = (a) => !a ? null : a.decision === "yes" ? (a.confidence === "low" ? "likely" : "yes") : (a.confidence === "low" ? "unsure" : "no");
const where = (b) => (b === "CHE" ? T().federal : b || "");
const LEVELS = ["", "country", "canton", "city", "municipality"];
let HITS = [], LASTQ = null, SEARCH_TOPIC = null, MODE = null, SEARCHED = false, CHECKED = 0;
const OPEN = new Set(), DETAIL = {}, FLAGGED = new Set(), NOTES = {scope: null, years: false, reset: null};

function renderNotes() {
  const L = T(), parts = [];
  if (NOTES.reset) parts.push(L.n_reset.replace("{t}", topicName(NOTES.reset)));
  if (NOTES.scope) parts.push(L[NOTES.scope]);
  if (NOTES.years) parts.push(L.n_years);
  $("fnote").textContent = parts.join(" ");
  $("fnote").hidden = !parts.length;
}

function metaLine(h) {
  const L = T();
  return [h.body_name || where(h.body_key), L.levels[h.level] || "", h.year ? Math.round(h.year) : "",
          LANG === "en" && h.affair_type && h.affair_type !== "unknown" ? h.affair_type : "", h.number ? `Nr. ${h.number}` : ""].filter(Boolean).join(" · ");
}

function tagFor(h) {
  const v = verdict(h.topic_answer); if (!v || !SEARCH_TOPIC) return "";
  return `<span class="tag ${v}">${esc(topicName(SEARCH_TOPIC))} · ${esc(T().verdict[v])}</span>`;
}

function topicsHTML(id, d) {
  const L = T();
  if (d.topics === null) return "";
  if (d.topics === undefined) return `<div class="topics"><span class="num">${esc(L.t_head)}</span><p class="note">${esc(L.t_loading)}</p></div>`;
  const shown = d.topics.filter((r) => r.decision === "yes");
  if (!shown.length) return `<div class="topics"><span class="num">${esc(L.t_head)}</span><p class="note">${esc(L.t_none)}</p></div>`;
  const known = new Set(TOPICS_META.map((x) => x.id));
  return `<div class="topics"><span class="num">${esc(L.t_head)}</span><ul>${shown.map((r) => {
    const v = verdict(r), key = `${id}:${r.topic}`, name = esc(topicName(r.topic, r.names));
    const pick = `<button type="button" class="pick" ${known.has(r.topic) ? `data-act="pick" data-topic="${esc(r.topic)}" title="${esc(L.t_pick)}"` : "disabled"}>${name} · ${esc(L.verdict[v])}</button>`;
    const flag = FLAGGED.has(key) ? `<span class="done">${esc(L.t_reported)}</span>` : `<button type="button" class="wrong" data-act="flag" data-id="${id}" data-topic="${esc(r.topic)}">${esc(L.t_wrong)}</button>`;
    return `<li class="pill ${v}">${pick}${flag}</li>`;
  }).join("")}</ul></div>`;
}

function detailHTML(h, d) {
  const L = T(), ev = d.evidence, id = h.openparldata_id, v = verdict(h.topic_answer);
  const facts = [[L.r_type, d.type], [L.r_state, d.state], [L.r_date, d.begin_date]].filter(([, x]) => x)
    .map(([k, x]) => `<span>${esc(k)}: ${esc(x)}</span>`).join("");
  const line = SEARCH_TOPIC && v && ev?.evidence_quote ? `<p class="verdict-line">${esc(L.quote_hint.replace("{t}", topicName(SEARCH_TOPIC)))}</p>` : "";
  const text = d.excerpt ? `<div class="evidence">${ev?.evidence_quote ? highlight(d.excerpt, ev.evidence_quote) : esc(d.excerpt.slice(0, 900)) + (d.excerpt.length > 900 ? " …" : "")}</div>` : "";
  const sim = d.similar ? `<div class="similar"><span class="num">${esc(L.r_similar)}</span><ol>${d.similar.map((x) => `<li><button type="button" data-q="${esc(x.title || "")}"><span class="t">${esc((x.title || "#" + x.openparldata_id).slice(0, 150))}</span><span class="w">${esc(x.body_name || where(x.body_key))}</span></button></li>`).join("")}</ol></div>` : "";
  const key = `${id}:${SEARCH_TOPIC}`;
  const flag = SEARCH_TOPIC && (v === "yes" || v === "likely") ? (FLAGGED.has(key) ? `<span class="flagged">${esc(L.flagged)}</span>` : `<button type="button" class="flag" data-act="flag" data-id="${id}" data-topic="${esc(SEARCH_TOPIC)}">${esc(L.flag.replace("{t}", topicName(SEARCH_TOPIC)))}</button>`) : "";
  return `${facts ? `<div class="facts">${facts}</div>` : ""}
    ${line}${text}
    ${d.text_source === "title_only" ? `<p class="note">${esc(L.title_only)}</p>` : ""}
    ${ev?.reason ? `<p class="reason"><b>${esc(L.why)}</b>${esc(ev.reason)}</p>` : ""}
    ${topicsHTML(id, d)}
    <div class="links">
      ${d.url_external ? `<a href="${esc(d.url_external)}" target="_blank" rel="noopener">${esc(L.r_open)} ↗</a>` : ""}
      <a href="${esc(d.url_openparldata)}" target="_blank" rel="noopener">OpenParlData ↗</a>
      ${d.similar ? "" : `<button type="button" data-act="sim" data-id="${id}">${esc(L.r_similar)}</button>`}
      ${flag}
    </div>${sim}`;
}

function renderHits() {
  const L = T(), n = HITS.length, t = SEARCH_TOPIC ? topicName(SEARCH_TOPIC) : "";
  let count = "", note = "";
  if (!SEARCHED) count = MODE === "empty" ? L.r_empty : "";
  else if (!n) count = MODE === "query" ? L.r_none : MODE === "query_topic" ? L.r_none_qt.replace("{c}", CHECKED).replace("{q}", LASTQ).replace("{t}", t) : L.r_none_topic.replace("{t}", t);
  else if (MODE === "topic") count = L.r_count_browse.replace("{n}", n).replace("{t}", t);
  else if (MODE === "query_topic") count = L.r_count_topic.replace("{n}", n).replace("{q}", LASTQ).replace("{t}", t);
  else count = L.r_count.replace("{n}", n).replace("{q}", LASTQ);
  if (SEARCHED && n && MODE === "topic") note = L.r_note_browse;
  if (SEARCHED && MODE === "query_topic") note = n ? L.r_note_qt.replace("{t}", t) : L.r_hint_qt;
  $("rcount").textContent = count;
  $("rnote").textContent = note; $("rnote").hidden = !note;
  $("hits").innerHTML = HITS.map((h) => {
    const id = h.openparldata_id, open = OPEN.has(id);
    return `<li class="hit ${open ? "open" : ""}">
      <button class="hit-head" type="button" data-id="${id}" aria-expanded="${open}">
        <span class="hit-title">${esc(h.title || "#" + id)}</span>
        <span class="hit-meta">${esc(metaLine(h))}</span>
        <span class="hit-side">${tagFor(h)}</span>
      </button>
      <div class="hit-body" ${open ? "" : "hidden"}>${DETAIL[id] ? detailHTML(h, DETAIL[id]) : `<p class="note">${esc(L.r_loading)}</p>`}</div>
    </li>`;
  }).join("");
}

let SEQ = 0;
async function runSearch(q) {
  q = (q || "").trim(); if (q.length < 2) q = "";
  const topic = $("topic").value, L = T();
  $("q").value = q; OPEN.clear();
  if (!q && !topic) { HITS = []; SEARCHED = false; MODE = "empty"; LASTQ = null; renderHits(); return; }
  const params = new URLSearchParams({limit: 20});
  if (q) params.set("q", q);
  if (topic) params.set("topic", topic);
  const sc = scopeOf(topic);
  if (sc?.body) params.set("body", sc.body);
  if ($("level").value) params.set("level", $("level").value);
  if ($("yfrom").value) params.set("year_from", $("yfrom").value);
  if ($("yto").value) params.set("year_to", $("yto").value);
  const seq = ++SEQ;
  $("sgo").disabled = true; HITS = []; SEARCHED = false; MODE = null; renderHits();
  $("rcount").textContent = topic ? L.r_loading_topic : L.r_loading;
  try {
    const r = await fetch(`/search?${params}`), d = await r.json();
    if (seq !== SEQ) return;
    if (!r.ok) throw new Error(d.detail || "failed");
    LASTQ = d.query || ""; SEARCH_TOPIC = d.topic; MODE = d.mode; HITS = d.results; SEARCHED = true; CHECKED = d.checked || 0;
    renderHits();
  } catch (e) { if (seq === SEQ) { $("rcount").textContent = T().failed; $("rnote").hidden = true; } }
  finally { if (seq === SEQ) $("sgo").disabled = false; }
}
const rerun = () => { if (SEARCHED || $("q").value.trim() || $("topic").value) runSearch($("q").value); };

async function toggle(id) {
  if (OPEN.has(id)) { OPEN.delete(id); renderHits(); return; }
  OPEN.add(id); renderHits();
  if (DETAIL[id]) return;
  let d;
  try { d = await (await fetch(`/affairs/${id}/detail?lang=${LANG}`)).json(); } catch (e) { d = {url_openparldata: `https://api.openparldata.ch/v1/affairs/${id}`}; }
  DETAIL[id] = d; renderHits();
  fetch(`/affairs/${id}/topics/live`).then((r) => (r.ok ? r.json() : null)).catch(() => null).then((rows) => { d.topics = rows; renderHits(); });
  const h = HITS.find((x) => x.openparldata_id === id), v = verdict(h?.topic_answer);
  if (SEARCH_TOPIC && v && v !== "no") {
    try {
      const r = await fetch("/classify", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({topic: SEARCH_TOPIC, affair_id: id})});
      if (r.ok) { d.evidence = await r.json(); renderHits(); }
    } catch (e) {}
  }
}

function applyScope() {
  const sc = scopeOf($("topic").value), lvl = $("level");
  [...lvl.options].forEach((o) => { o.disabled = !!sc && o.value !== sc.level; });
  if (sc && lvl.value !== sc.level) lvl.value = sc.level;
  NOTES.scope = sc ? (sc.body === "SG" ? "n_sg" : "n_curia") : null;
  renderNotes();
}

function renderTopics() {
  const L = T(), sel = $("topic"), cur = sel.value, lvl = $("level").value;
  const applies = (t) => !t.scope || !lvl || t.scope.level === lvl;
  const opt = (t) => `<option value="${esc(t.id)}">${esc(topicName(t.id))}</option>`;
  const group = (label, ts) => ts.length ? `<optgroup label="${esc(label)}">${ts.map(opt).join("")}</optgroup>` : "";
  const byName = (a, b) => topicName(a.id).localeCompare(topicName(b.id));
  const shown = TOPICS_META.filter(applies);
  sel.innerHTML = `<option value="">${esc(L.f_none)}</option>`
    + group(L.g_adhoc, shown.filter((t) => !t.scope).sort(byName))
    + group(L.g_curia, shown.filter((t) => t.scope?.body === "CHE").sort(byName))
    + group(L.g_sg, shown.filter((t) => t.scope?.body === "SG").sort(byName));
  if (cur && !shown.some((t) => t.id === cur)) { NOTES.reset = cur; sel.value = ""; }
  else sel.value = cur || "";
}

function checkYears() {
  const a = $("yfrom"), b = $("yto");
  NOTES.years = false;
  if (a.value && b.value && Number(a.value) > Number(b.value)) { [a.value, b.value] = [b.value, a.value]; NOTES.years = true; }
  renderNotes();
}

$("sform").addEventListener("submit", (e) => { e.preventDefault(); runSearch($("q").value); });
$("examples").addEventListener("click", (e) => { const b = e.target.closest("button[data-q]"); if (b) runSearch(b.dataset.q); });
$("hits").addEventListener("click", async (e) => {
  const head = e.target.closest(".hit-head"); if (head) { toggle(Number(head.dataset.id)); return; }
  const q = e.target.closest(".similar button[data-q]"); if (q) { runSearch(q.dataset.q); window.scrollTo({top: $("finder").offsetTop - 16, behavior: "smooth"}); return; }
  const act = e.target.closest("[data-act]"); if (!act) return;
  if (act.dataset.act === "pick") {
    NOTES.reset = null; $("topic").value = act.dataset.topic; applyScope(); renderTopics(); $("topic").value = act.dataset.topic;
    runSearch($("q").value); window.scrollTo({top: $("finder").offsetTop - 16, behavior: "smooth"}); return;
  }
  const id = Number(act.dataset.id), d = DETAIL[id];
  if (act.dataset.act === "sim") {
    try { d.similar = await (await fetch(`/affairs/${id}/similar?limit=5`)).json(); } catch (err) { d.similar = []; }
    renderHits();
  } else if (act.dataset.act === "flag") {
    const topic = act.dataset.topic;
    try { await fetch("/flags", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({affair_id: id, topic})}); } catch (err) {}
    FLAGGED.add(`${id}:${topic}`); renderHits();
  }
});
$("topic").addEventListener("change", () => { NOTES.reset = null; applyScope(); renderTopics(); rerun(); });
$("level").addEventListener("change", () => { NOTES.reset = null; applyScope(); renderTopics(); rerun(); });
["yfrom", "yto"].forEach((k) => $(k).addEventListener("change", () => { checkYears(); rerun(); }));

function renderFilters() {
  const L = T(), cur = $("level").value;
  $("level").innerHTML = LEVELS.map((l) => `<option value="${l}">${esc(L.levels[l || "all"])}</option>`).join("");
  $("level").value = cur || "";
  $("examples").innerHTML = L.examples.map((x) => `<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join("");
  $("q").placeholder = L.s_placeholder;
}

function setLang(lang, first = false) {
  if (!I18N[lang] || (lang === LANG && !first)) return;
  LANG = lang;
  const L = T();
  document.documentElement.lang = lang;
  document.title = L.title;
  document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = L[el.dataset.i]; });
  $("topleft").textContent = `OpenParlData · 88 ${L.parl}`;
  $("langs").setAttribute("aria-label", L.langs);
  $("langs").innerHTML = LANGS.map((l) => `${l === "en" ? '<i class="sep" aria-hidden="true"></i>' : ""}<button type="button" lang="${l}" data-l="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join("");
  renderFilters();
  renderTopics();
  applyScope();
  renderHits();
}
$("langs").addEventListener("mouseover", (e) => { const b = e.target.closest("button[data-l]"); if (b) setLang(b.dataset.l); });
$("langs").addEventListener("click", (e) => { const b = e.target.closest("button[data-l]"); if (b) setLang(b.dataset.l); });
$("langs").addEventListener("focusin", (e) => { const b = e.target.closest("button[data-l]"); if (b) setLang(b.dataset.l); });

setLang("de", true);
fetch("/topics").then((r) => r.json()).then((topics) => {
  TOPICS_META = topics.filter((t) => t.calibrated);
  renderTopics();
}).catch(() => {}).finally(() => runSearch(T().examples[0]));
</script>
</body>
</html>
